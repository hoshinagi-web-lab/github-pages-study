<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="星凪島自然観察ガイドのサイト内検索です。地域を指定して検索できます。">
  <title>サイト内検索｜星凪島 自然観察ガイド</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="assets/images/island-map.svg" type="image/svg+xml">
</head>
<body>
  <a class="skip-link" href="#main">本文へ移動</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">星凪島 自然観察ガイド</a>
      <nav class="site-nav" aria-label="主要メニュー">
        <ul>
          <li><a href="index.html">島の全体案内</a></li>
          <li><a href="north-shore/index.html">北海岸</a></li>
          <li><a href="central-forest/index.html">中央の森</a></li>
          <li><a href="south-port/index.html">南港</a></li>
          <li><a aria-current="page" href="search.html">サイト内検索</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="content">
    <nav class="breadcrumb" aria-label="パンくずリスト"><a href="index.html">トップ</a> / サイト内検索</nav>
    <div class="page-heading">
      <p class="eyebrow">Site Search</p>
      <h1>サイト内検索</h1>
      <p class="lead">星凪島の全地域をまとめて検索するか、北海岸・中央の森・南港のいずれかに対象を絞って検索できます。</p>
    </div>

    <form id="search-form" class="search-form" role="search">
      <div class="search-field search-keyword">
        <label for="search-input">検索する言葉</label>
        <input id="search-input" name="q" type="search" placeholder="例：灯台、植物、散策" autocomplete="off">
      </div>
      <div class="search-field">
        <label for="search-area">検索する地域</label>
        <select id="search-area" name="area">
          <option value="">サイト全体</option>
          <option value="北海岸" data-label="北海岸">北海岸</option>
          <option value="中央の森" data-label="中央の森">中央の森</option>
          <option value="南港" data-label="南港">南港</option>
        </select>
      </div>
      <button id="search-submit" type="submit" disabled>検索</button>
    </form>

    <p id="search-status" class="search-status" role="status" aria-live="polite">検索機能を読み込んでいます…</p>
    <section id="search-results" class="search-results" aria-label="検索結果"></section>

    <noscript><div class="note">サイト内検索を利用するにはJavaScriptを有効にしてください。</div></noscript>
  </main>

  <footer class="site-footer">
    <div class="footer-inner"><p><strong>星凪島 自然観察ガイド</strong></p><p>検索索引はPagefindを使って静的HTMLから生成しています。</p></div>
  </footer>
  <script type="module" src="assets/js/search.js"></script>
</body>
</html>
